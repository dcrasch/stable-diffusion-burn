[package]
name = "stablediffusion"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
wgpu-backend = ["burn/wgpu"]

[dependencies]
burn = { version = "0.19.1", default-features = false, features=["std"] }
burn-ndarray = "0.19.1"
burn-tch = "0.19.1"
burn-autodiff = "0.19.1"
tch = "0.22.0"
serde = {version = "1.0.171", features = ["std", "derive"]}
npy = "0.4.0"
num-traits = "0.2.15"
rust_tokenizers = "8.1.0"
regex = "1.9.1"
image = "0.24.6"
cfg-if = "0.1"
